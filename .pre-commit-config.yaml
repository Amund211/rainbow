default_stages: [pre-commit, pre-push]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: check-yaml
          - id: sort-simple-yaml
          - id: check-merge-conflict
          - id: check-added-large-files

    - repo: https://github.com/oxc-project/mirrors-oxlint
      rev: v1.75.0
      hooks:
          - id: oxlint
            verbose: false
            # Mirror .oxlintrc.json ignorePatterns: oxlint exits 1 if every
            # file it is handed is ignored ("No files found to lint").
            exclude: ^src/(routeTree\.gen\.ts|vite-env\.d\.ts)$

    - repo: https://github.com/oxc-project/mirrors-oxfmt
      rev: v0.60.0
      hooks:
          - id: oxfmt
            verbose: false
            # Mirror .oxfmtrc.json ignorePatterns
            exclude: ^(src/routeTree\.gen\.ts|coverage/)

    - repo: local
      hooks:
          - id: test
            name: Test
            entry: pnpm run 'test:unit'
            language: system
            pass_filenames: false
          - id: typecheck
            name: Check types
            entry: pnpm run tsc
            language: system
            pass_filenames: false
